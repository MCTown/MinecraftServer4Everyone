         vendor/babel.js 固定 7.26.4（classic runtime）。改动参考 settings-redesign/index.html。 -->
    <script src="../../vendor/react.js"></script>
    <script src="../../vendor/react-dom.js"></script>
    <script src="../../vendor/babel.js"></script>
    <script src="../../vendor/lucide.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>该原型需要 JavaScript。</noscript>
    <script type="text/babel" data-presets="react" src="data.jsx"></script>
    <script type="text/babel" data-presets="react" src="parts.jsx"></script>
    <script type="text/babel" data-presets="react" src="dashboard.jsx"></script>
    <script type="text/babel" data-presets="react" src="console.jsx"></script>
    <script type="text/babel" data-presets="react" src="app.jsx"></script>
  </body>
</html>
