<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings Redesign · Server Agent</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="layouts.css" />
    <link rel="icon" href="data:," />
    <!-- 依赖全部本地化到 opendesign/vendor/，不走 CDN。两个原因：
         1) 浏览器所在机器可能访问不到 unpkg.com，一旦拉不到就是整页空白。
         2) 不带版本号的 @babel/standalone 现在解析到 8.x，preset-react 默认走
            automatic runtime，会往产物注入 import "react/jsx-runtime"，作为普通
            script 追加时报 "Cannot use import statement outside a module"。
         vendor/babel.js 固定为 7.26.4（classic runtime，React.createElement）。 -->
    <script src="../../vendor/react.js"></script>
    <script src="../../vendor/react-dom.js"></script>
    <script src="../../vendor/babel.js"></script>
    <script src="../../vendor/lucide.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>该原型需要 JavaScript。</noscript>
    <script type="text/babel" data-presets="react" src="data.jsx"></script>
    <script type="text/babel" data-presets="react" src="parts.jsx"></script>
    <script type="text/babel" data-presets="react" src="direction-docked.jsx"></script>
    <script type="text/babel" data-presets="react" src="direction-sheet.jsx"></script>
    <script type="text/babel" data-presets="react" src="direction-ledger.jsx"></script>
    <script type="text/babel" data-presets="react" src="app.jsx"></script>
  </body>
</html>
